name: Automated Testing & Correctness Verification

on:
  push:
    branches: [ main, core_algorithm, phase2, optimized ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Julia Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK (for SPMF reference)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: 4. Install Project Dependencies
        shell: bash
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: 5. Run Full Test Suite (unit tests + correctness vs SPMF)
        shell: bash
        run: |
          julia --project=. tests/runtests.jl

      - name: 6. CLI smoke test (src/main.jl must print a summary and write the output file)
        shell: bash
        run: |
          for algo in baseline optimized; do
            julia --project=. src/main.jl -i data/toy/sample.txt -m 40% -a $algo -o /tmp/out_$algo.txt | tee /tmp/log_$algo.txt
            grep -q "Closed Itemsets: 7" /tmp/log_$algo.txt
            test -s /tmp/out_$algo.txt
          done
